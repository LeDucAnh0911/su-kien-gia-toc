<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/su-kien-gia-toc/">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Sự Kiện Gia Tộc - Lịch Âm Dương & Phả Hệ">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sự Kiện Gia Tộc">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Sự Kiện Gia Tộc</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #8B1E0F;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #8B1E0F 0%, #4D0901 100%);
      color: #FFF;
      text-align: center;
      z-index: 999999;
    }
    .logo-box {
      width: 68px;
      height: 68px;
      border: 2px solid #D4AF37;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      margin-bottom: 16px;
      background: rgba(212, 175, 55, 0.15);
      box-shadow: 0 0 24px rgba(212, 175, 55, 0.4);
    }
    .title {
      font-size: 21px;
      font-weight: 800;
      color: #D4AF37;
      letter-spacing: 1.5px;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 13.5px;
      color: #F3E5AB;
      margin-bottom: 24px;
    }
    .spinner {
      width: 38px;
      height: 38px;
      border: 3.5px solid rgba(212, 175, 55, 0.2);
      border-top-color: #D4AF37;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="logo-box">🏛️</div>
    <div class="title">SỰ KIỆN GIA TỘC</div>
    <div class="subtitle">Lịch Âm Dương & Phả Hệ Hoàng Kim</div>
    <div class="spinner"></div>
  </div>
  <script>
    function removeLoading() {
      var l = document.getElementById('loading');
      if (l) {
        l.style.transition = 'opacity 0.35s ease';
        l.style.opacity = '0';
        setTimeout(function() { l.remove(); }, 350);
      }
    }
    window.addEventListener('flutter-first-frame', removeLoading);
    var obs = new MutationObserver(function() {
      if (document.querySelector('flutter-view, flt-glass-pane, canvas')) {
        setTimeout(removeLoading, 400);
        obs.disconnect();
      }
    });
    obs.observe(document.body, { childList: true, subtree: true });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
