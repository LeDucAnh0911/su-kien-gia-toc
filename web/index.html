  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #8B1E0F;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #8B1E0F 0%, #4D0901 100%);
      color: #FFF;
      text-align: center;
      z-index: 999999;
    }
    .logo-box {
      width: 76px;
      height: 76px;
      border: 2px solid #D4AF37;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      background: rgba(212, 175, 55, 0.15);
      box-shadow: 0 0 28px rgba(212, 175, 55, 0.45);
      overflow: hidden;
    }
    .logo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }
    .title {
      font-size: 22px;
      font-weight: 800;
      color: #D4AF37;
      letter-spacing: 1.5px;
      margin-bottom: 6px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    .subtitle {
      font-size: 13.5px;
      color: #F3E5AB;
      margin-bottom: 24px;
      opacity: 0.9;
    }
    .spinner {
      width: 38px;
      height: 38px;
      border: 3.5px solid rgba(212, 175, 55, 0.2);
      border-top-color: #D4AF37;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .legal-links {
      position: absolute;
      bottom: 22px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px 18px;
      padding: 0 12px;
      font-size: 12px;
    }
    .legal-links a { color: #F3E5AB; }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="logo-box">
      <img src="apple-touch-icon.png" alt="Sự Kiện Gia Tộc" />
    </div>
    <div class="title">SỰ KIỆN GIA TỘC</div>
    <div class="subtitle">Lịch Âm Dương & Phả Hệ Hoàng Kim</div>
    <div class="spinner"></div>
    <div class="legal-links">
      <a href="privacy.html">Chính sách quyền riêng tư</a>
      <a href="terms.html">Điều khoản sử dụng</a>
    </div>
  </div>
  <noscript><p><a href="privacy.html">Chính sách quyền riêng tư</a> · <a href="terms.html">Điều khoản sử dụng</a></p></noscript>
  <script>
    function removeLoading() {
      var l = document.getElementById('loading');
      if (l) {
        l.style.transition = 'opacity 0.35s ease';
        l.style.opacity = '0';
        setTimeout(function() { if (l && l.parentNode) l.parentNode.removeChild(l); }, 350);
      }
    }
    window.addEventListener('flutter-first-frame', removeLoading);
    var obs = new MutationObserver(function() {
      if (document.querySelector('flutter-view, flt-glass-pane, canvas')) {
        setTimeout(removeLoading, 400);
        obs.disconnect();
      }
    });
    obs.observe(document.body, { childList: true, subtree: true });

    // Đăng ký Service Worker Cache-First để nạp tức thì trong < 1s trên iPhone/Android
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('flutter_service_worker.js?v=20261010_2')
          .then(function(reg) {
            console.log('PWA ServiceWorker ready with scope:', reg.scope);
          })
          .catch(function(err) {
            console.log('SW registration note:', err);
          });
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
